# Properties for MODULE=signup-oidc (onboard_esignet_signup_oidc_partner in default.sh)
# Edit this file and rerun the onboarder Job to change any of these values -
# e.g. after a "client public key already exists" error, pick a new
# PARTNER_KC_USERNAME here and rerun.

APPLICATION_ID=partner
MODULE_CLIENTID=mosip-pms-client
PARTNER_KC_USERNAME=mosip-signup-oauth-client
OIDC_CLIENT_NAME=mosip-signup-oauth-client
OIDC_CLIENTID=mosip-signup-oauth-client

# Keycloak user created (and later deleted) to act as the partner manager for this run.
PARTNER_MANAGER_USERNAME=signup-oidc-kc-mockusername
PARTNER_MANAGER_PASSWORD=signup-oidc-kc-mockuserpassword

# Leave LOGO_URI/REDIRECT_URIS empty to keep the old auto-derived default
# (https://healthservices.<installation-domain>/images/brand_logo.png and
# https://signup.<installation-domain>/identity-verification).
# Set them explicitly to override for your deployment.
LOGO_URI=
REDIRECT_URIS=

# This module has no create/publish_policy_group_and_policy step - no POLICY_DATA_FILE.
