# Properties for MODULE=sunbird-oidc (onboard_esignet_sunbird_partner in default.sh)
# Edit this file and rerun the onboarder Job to change any of these values -
# e.g. after a "client public key already exists" error, pick a new
# PARTNER_KC_USERNAME here and rerun.

APPLICATION_ID=partner
MODULE_CLIENTID=mosip-pms-client
PARTNER_KC_USERNAME=esignet-sunbird-partner
OIDC_CLIENT_NAME=esignet-sunbird-partner
OIDC_CLIENTID=esignet-sunbird-partner

# Keycloak user created (and later deleted) to act as the partner manager for this run.
PARTNER_MANAGER_USERNAME=sunbird-oidc-kc-mockusername
PARTNER_MANAGER_PASSWORD=sunbird-oidc-kc-mockuserpassword

# Leave LOGO_URI/REDIRECT_URIS empty to keep the old auto-derived default
# (https://sunbird.org/images/sunbird-logo-new.png and the inji redirect URIs based on
# <installation-domain>). Set them explicitly to override for your deployment.
LOGO_URI=
REDIRECT_URIS=

# This module has no create/publish_policy_group_and_policy step - no POLICY_DATA_FILE.
