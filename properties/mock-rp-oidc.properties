# Properties for MODULE=mock-rp-oidc (onboard_mock_relying_party_with_mock_rp_oidc_client in default.sh)
# Edit this file and rerun the onboarder Job to change any of these values -
# e.g. after a "policy group/policy/partner already exists" or similar PMS error,
# pick a new PARTNER_KC_USERNAME/POLICY_NAME/POLICY_GROUP_NAME here and rerun.

APPLICATION_ID=partner
MODULE_CLIENTID=mosip-pms-client
POLICY_NAME=mpolicy-default-mock-rp-oidc12
POLICY_GROUP_NAME=mpolicygroup-default-mock-rp-oidc12
PARTNER_KC_USERNAME=mpartner-default-mock-rp-oidc12
PARTNER_ORGANIZATION_NAME=IITB
PARTNER_TYPE=Auth_Partner
PARTNER_DOMAIN=Auth

# Keycloak user created (and later deleted) to act as the partner manager for this run.
PARTNER_MANAGER_USERNAME=mock-rp-oidc-kc-mockusername
PARTNER_MANAGER_PASSWORD=mock-rp-oidc-kc-mockuserpassword

OIDC_CLIENT_NAME="Health service OIDC Client13"
OIDC_CLIENTID=default-non-mosipid-oidc-client13

# Leave LOGO_URI/REDIRECT_URIS empty to keep the old auto-derived default
# (https://healthservices.<installation-domain>/logo.png and .../userprofile).
# Set them explicitly to override for your deployment.
LOGO_URI=https://testingthis.com
REDIRECT_URIS=https://hello.com,https://world.com

# eSignet-deployed-against-MosipID toggle (used by the collection to skip/run certain
# requests). Leave empty for the historical default (non-MosipID / "false") behavior.
MOSIP_ID=false

# PMS's V3 OIDC-client fields (both optional) - provide raw JSON as-is, e.g.:
#   CLIENT_NAME_LANG_MAP='{"eng":"Health service OIDC Client"}'
#   ADDITIONAL_CONFIG='{"consent_expire_in_mins":"20160","signup_banner_required":true}'
# Leave blank to send an empty object (dev2's PMS NPEs on a literal null here). MUST wrap the whole JSON
# value in single quotes as shown - unquoted or double-quoted, the shell strips the inner
# double quotes and breaks the JSON. See properties/README.md's "File format" note.
CLIENT_NAME_LANG_MAP='{"eng":"Health service OIDC Client10"}'
ADDITIONAL_CONFIG='{"consent_expire_in_mins":"20160","signup_banner_required":true,"forgot_pwd_link_required":true}'

# Claims/ACRs requested from esignet for this OIDC client - comma-separated, converted to a
# JSON array by the collection. "individual_id" is NOT a valid claim against the current
# esignet client-mgmt API (Go rewrite) - only standard OIDC claims are accepted.
OIDC_USER_CLAIMS=birthdate,address,gender,name,phone_number,picture,email
OIDC_AUTH_CONTEXT_REFS=mosip:idp:acr:linked-wallet,mosip:idp:acr:biometrics,mosip:idp:acr:generated-code,mosip:idp:acr:password

# Auth-policy document applied to the created policy.
POLICY_DATA_FILE=./default-mock-rp-oidc-policy.json

# Set to "false" to skip writing this run's onboarding result into the live cluster
# (patching the mock relying party's private-key secret, restarting mock-relying-party-service,
# and setting mock-relying-party-ui's CLIENT_ID env var) - useful for a one-off/local/test
# onboard that shouldn't touch anything already running. The client ID/keys are still
# available in config-secrets.json and the html report either way. Leave blank/unset to
# keep the default (true).
SYNC_LIVE_DEPLOYMENT=

# Real k8s resource names the SYNC_LIVE_DEPLOYMENT step above targets - should match
# whatever the mock relying party is actually deployed as (esignet-mock-services'
# install.sh already has MOCK_REPLYING_PARTY_SERVICE_NAME for its own restart; pass the
# same value through here instead of relying on the historical hardcoded defaults below).
# Leave blank to keep the historical defaults.
MOCK_RELYING_PARTY_SERVICE_NAME=
MOCK_RELYING_PARTY_UI_NAME=
MOCK_RELYING_PARTY_PRIVATE_KEY_SECRET_NAME=
