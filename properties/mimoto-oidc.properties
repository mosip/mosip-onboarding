# Properties for MODULE=mimoto-oidc (onboard_mimoto_oidc_partner in default.sh)
# Edit this file and rerun the onboarder Job to change any of these values -
# e.g. after a "policy group/policy/partner already exists" or "client public key
# already exists" error, pick a new PARTNER_KC_USERNAME/POLICY_NAME/POLICY_GROUP_NAME
# here and rerun.

APPLICATION_ID=partner
MODULE_CLIENTID=mosip-pms-client
POLICY_NAME=mpolicy-default-mimotooidc
POLICY_GROUP_NAME=mpolicygroup-default-mimotooidc
PARTNER_KC_USERNAME=mpartner-default-mimotooidc
PARTNER_KC_USERPASSWORD=mimotooidc-kc-mockuserpassword
PARTNER_ORGANIZATION_NAME=IITB
PARTNER_TYPE=Auth_Partner
PARTNER_DOMAIN=Auth

# This module authenticates as the partner itself (no separate partner-manager user) -
# see PARTNER_KC_USERNAME/PARTNER_KC_USERPASSWORD above.

OIDC_CLIENT_NAME=mimoto-oidc

# Leave LOGO_URI/REDIRECT_URIS empty to keep the old auto-derived default
# (https://<mosip-api-host>/inji/inji-home-logo.png and the inji redirect URIs).
# Set them explicitly to override for your deployment.
LOGO_URI=
REDIRECT_URIS=

# Auth-policy document applied to the created policy.
POLICY_DATA_FILE=./default-mimoto-oidc-policy.json
