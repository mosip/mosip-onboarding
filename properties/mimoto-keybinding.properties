# Properties for MODULE=mimoto-keybinding (onboard_mimoto_keybinding_partner in default.sh)
# Edit this file and rerun the onboarder Job to change any of these values -
# e.g. after a "policy group/policy/partner already exists" or "label already exists"
# error, pick a new PARTNER_KC_USERNAME/POLICY_NAME/POLICY_GROUP_NAME here and rerun.

APPLICATION_ID=partner
MODULE_CLIENTID=mosip-pms-client
POLICY_NAME=mpolicy-default-mimotokeybinding
POLICY_GROUP_NAME=mpolicygroup-default-mimotokeybinding
PARTNER_KC_USERNAME=mpartner-default-mimotokeybinding
PARTNER_KC_USERPASSWORD=mimotokeybinding-kc-mockuserpassword
PARTNER_ORGANIZATION_NAME=IITB
PARTNER_TYPE=Auth_Partner
PARTNER_DOMAIN=Auth

# This module authenticates as the partner itself (no separate partner-manager user) -
# see PARTNER_KC_USERNAME/PARTNER_KC_USERPASSWORD above.

# Auth-policy document applied to the created policy.
POLICY_DATA_FILE=./default-mimoto-keybinding-policy.json

# Set to "false" to skip writing this run's onboarding result into the live cluster
# (creating the mimoto-wallet-binding-partner-api-key secret) - useful for a
# one-off/local/test onboard that shouldn't touch anything already running. The API
# key is still available in config-secrets.json and the html report either way.
# Leave blank/unset to keep the default (true).
SYNC_LIVE_DEPLOYMENT=
